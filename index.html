<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hướng dẫn cài đặt DNS Locket Gold</title>
    <style>
        /* Giữ nguyên Font và Style nền từ bản gốc */
        * { box-sizing: border-box; transition: all 0.3s ease; }
        
        body {
            font-family: 'Inter', -apple-system, system-ui, sans-serif;
            background: #eef2ff;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #1e293b;
            padding: 20px;
        }

        .container {
            width: 95%;
            max-width: 420px;
            background: #fff;
            border-radius: 30px;
            padding: 30px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
        }

        h2 {
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #3b82f6;
            margin-bottom: 8px;
            text-align: left;
        }

        p {
            font-size: 17px;
            font-weight: 500;
            line-height: 1.5;
            margin-bottom: 20px;
            text-align: left;
        }

        /* Nút cài đặt DNS màu đỏ đặc trưng */
        .btn-link-dns {
            display: block;
            width: 100%;
            padding: 16px;
            background: #ef4444;
            color: white;
            text-decoration: none;
            text-align: center;
            border-radius: 15px;
            font-weight: 700;
            margin-bottom: 25px;
            box-shadow: 0 4px 12px rgba(239, 68, 68, 0.2);
        }

        .btn-link-dns:hover { 
            transform: scale(1.02); 
            background: #dc2626; 
        }

        /* Danh sách ảnh hướng dẫn xếp chồng */
        .img-stack {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 20px;
        }

        .img-stack img {
            width: 100%;
            height: auto;
            border-radius: 15px;
            border: 1px solid #e2e8f0;
            object-fit: cover;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        /* Ghi chú màu vàng */
        .note {
            background: #fffbeb;
            padding: 12px;
            border-left: 4px solid #f59e0b;
            font-size: 13px;
            border-radius: 8px;
            margin-top: 10px;
            color: #92400e;
            text-align: left;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Hướng dẫn DNS</h2>
    <p>Nhấp vào nút đỏ bên dưới để cài đặt cấu hình DNS. Sau đó xem hướng dẫn chi tiết bên dưới:</p>
    
    <a href="https://manhlocket.github.io/dns/" class="btn-link-dns">Cài đặt DNS Gold 🚀</a>
    
    <div class="img-stack">
        <img src="IMG_1083.jpeg" alt="Hướng dẫn 1">
        <img src="IMG_1084.jpeg" alt="Hướng dẫn 2">
        <img src="IMG_1085.jpeg" alt="Hướng dẫn 3">
        <img src="IMG_1087.jpeg" alt="Vào cài đặt và làm theo hướng dẫn 4">
        <img src="IMG_1088.jpeg" alt="Hướng dẫn 5">
        <img src="IMG_1089.jpeg" alt="Hướng dẫn 6">
        <img src="IMG_1090.jpeg" alt="Hướng dẫn 7">
    </div>

    <div class="note">
        <b>Lưu ý:</b> Sau khi nhấn tải DNS, hãy làm lần lượt theo thứ tự các hình trên để hoàn tất quá trình kích hoạt Locket Gold.
    </div>
</div>

</body>
</html>
